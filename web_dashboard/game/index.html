<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="only light">
  <title>SI3LN – Play</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000428; }

    /* full-viewport iframe — fills the entire page */
    #pygbag-frame {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* loading overlay shown until iframe fires its first load event */
    #overlay {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background: linear-gradient(180deg, #000428 0%, #004e92 100%);
      z-index: 20;
      transition: opacity 0.5s ease;
      font-family: 'Courier New', monospace;
      color: #fff;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .logo {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.6rem;
      background: linear-gradient(90deg, #00d2ff, #3a47d5);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #status  { font-size: 0.95rem; color: #aac; min-height: 1.4em; text-align: center; }
    #bar-wrap {
      width: min(340px, 80vw); height: 8px;
      background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
    }
    #bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #00d2ff, #3a47d5);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* guest banner */
    #guest-banner {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(255,165,0,0.85);
      color: #000; text-align: center;
      padding: 6px 12px; font-size: 0.82rem;
      z-index: 25;
      font-family: sans-serif;
    }
    #guest-banner a { color: #002; font-weight: bold; }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="overlay">
  <div class="logo">ARCAD3X</div>
  <div id="status">Preparing Python game…</div>
  <div id="bar-wrap"><div id="bar"></div></div>
</div>

<!-- Pygbag iframe – src set by JS after token injection -->
<iframe id="pygbag-frame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>

<!-- Guest banner -->
<div id="guest-banner">
  ℹ️ Playing as guest – score won't be saved.
  <a href="#" onclick="exitGame(); return false;">Login via dashboard</a>
</div>

<script>
// ── Token helper ──────────────────────────────────────────────────────────────
function _gameAuthToken() {
    return localStorage.getItem('SI3LN_SESSION')
        || localStorage.getItem('access_token')
        || localStorage.getItem('SI3LN_JWT_TOKEN');
}

// ── 0a. Score submission bridge (called by Pygbag Python via platform.window) ─
// Receives a JSON string from the game and forwards it to the API with the JWT.
window.SI3LN_submit_score = function(dataJson) {
    var tk = _gameAuthToken();
    if (!tk) {
        console.warn('[leaderboard] no auth token — score NOT submitted. Log in via the dashboard.');
        return;
    }
    try {
        var payload = typeof dataJson === 'string' ? JSON.parse(dataJson) : dataJson;
        fetch('/api/game/leaderboard/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + tk
            },
            body: JSON.stringify(payload)
        }).then(function(r) {
            if (r.ok) {
                console.log('[leaderboard] score submitted (score=' + payload.score + ')');
                // Refresh the cached leaderboard so the game-over screen shows the new run
                if (window.SI3LN_fetch_leaderboard) window.SI3LN_fetch_leaderboard(null, 20);
            } else {
                r.text().then(function(t) {
                    console.warn('[leaderboard] submit rejected HTTP ' + r.status + ': ' + t);
                });
            }
        }).catch(function(e) { console.warn('[leaderboard] submit network error:', e); });
    } catch(e) { console.warn('[leaderboard] submit payload error:', e); }
};

// ── 0b. Leaderboard fetch bridge (called by Pygbag Python via platform.window) ─
// Fetches global leaderboard from the API and caches it in SI3LN_LEADERBOARD_CACHE.
// Python reads: platform.window.SI3LN_LEADERBOARD_CACHE (JSON string).
window.SI3LN_LEADERBOARD_CACHE = null;
window.SI3LN_fetch_leaderboard = function(worldId, limit) {
    var url = '/api/game/leaderboard/global?limit=' + (limit || 20);
    if (worldId != null && worldId !== 'null') url += '&world=' + worldId;
    var tk = _gameAuthToken();
    var headers = {};
    if (tk) headers['Authorization'] = 'Bearer ' + tk;
    fetch(url, { headers: headers })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
            if (data) window.SI3LN_LEADERBOARD_CACHE = JSON.stringify(data);
        })
        .catch(function() {});
};
// Pre-fetch on page load so data is ready when game over screen appears
window.SI3LN_fetch_leaderboard(null, 20);

// ── 0c. Progression bridges (called by Pygbag Python via platform.window) ─────
// Python reads platform.window.SI3LN_PROGRESS_CACHE (JSON string) on boot.
window.SI3LN_PROGRESS_CACHE = null;
window.SI3LN_fetch_progress = function() {
    var tk = _gameAuthToken();
    if (!tk) return;  // guest — nothing to restore
    fetch('/api/game/progress', { headers: { 'Authorization': 'Bearer ' + tk } })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
            if (data) {
                window.SI3LN_PROGRESS_CACHE = JSON.stringify(data);
                console.log('[progress] loaded', data);
            }
        })
        .catch(function(e) { console.warn('[progress] fetch error:', e); });
};
// Save progression to the API (called by the game after each level win).
window.SI3LN_save_progress = function(dataJson) {
    var tk = _gameAuthToken();
    if (!tk) {
        console.warn('[progress] no auth token — progression NOT saved.');
        return;
    }
    try {
        var payload = typeof dataJson === 'string' ? JSON.parse(dataJson) : dataJson;
        fetch('/api/game/progress', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tk },
            body: JSON.stringify(payload)
        }).then(function(r) {
            if (r.ok) {
                r.json().then(function(d) {
                    window.SI3LN_PROGRESS_CACHE = JSON.stringify(d);
                    console.log('[progress] saved', d);
                });
            } else {
                r.text().then(function(t) {
                    console.warn('[progress] save rejected HTTP ' + r.status + ': ' + t);
                });
            }
        }).catch(function(e) { console.warn('[progress] save network error:', e); });
    } catch(e) { console.warn('[progress] save payload error:', e); }
};
// Pre-fetch progression on page load so it's ready when the level selector opens.
window.SI3LN_fetch_progress();

// ── 0. Exit game helper (used in guest banner onclick) ───────────────────────
function exitGame() {
    try {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'exitGame' }, '*');
        } else {
            window.location.href = '/';
        }
    } catch(e) { window.location.href = '/'; }
}

// ── 1. Pull JWT from localStorage (shared with parent SPA, same origin) ───────
var TOKEN_KEY = 'SI3LN_SESSION';  // matches APP_CONFIG.TOKEN_KEY
var LEGACY_KEY = 'access_token';
var token = null;
try {
  // Same-origin sandboxed iframes share localStorage directly.
  // No need to access window.parent — it can throw under COEP / sandbox.
  token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem(LEGACY_KEY);

  // Reject expired tokens so the game starts in guest mode cleanly
  if (token) {
    try {
      var payload = JSON.parse(atob(token.split('.')[1]));
      if (payload.exp && payload.exp * 1000 < Date.now()) {
        console.warn('[game/index] Token expired – starting as guest');
        token = null;
      }
    } catch(_) { /* malformed → treat as no token */ token = null; }
  }
} catch(e) {
  console.warn('[game/index] localStorage read failed:', e);
}

if (token && token !== 'null') {
  // Expose on window so Pygbag Python (platform.window.SI3LN_JWT_TOKEN) can read it
  window.SI3LN_JWT_TOKEN = token;
  // Also keep in localStorage for any JS-side code
  localStorage.setItem('SI3LN_JWT_TOKEN', token);
  localStorage.setItem('SI3LN_API_URL', window.location.origin);
} else {
  localStorage.removeItem('SI3LN_JWT_TOKEN');
  document.getElementById('guest-banner').style.display = 'block';
}

// ── 2. Pass world/level/player params through to pygbag URL ──────────────────
var params = new URLSearchParams(window.location.search);
var pygbagParams = new URLSearchParams();
['world','level','player'].forEach(function(k) {
  if (params.get(k)) pygbagParams.set(k, params.get(k));
});
var pygbagSrc = '/pygbag/' + (pygbagParams.toString() ? '?' + pygbagParams : '');

// ── 3. Load iframe ────────────────────────────────────────────────────────────
var frame = document.getElementById('pygbag-frame');

// Animate progress bar while waiting
var pct = 10;
var barInterval = setInterval(function() {
  pct = Math.min(pct + 2, 90);
  document.getElementById('bar').style.width = pct + '%';
  if (pct >= 40) document.getElementById('status').textContent = 'Loading Python runtime…';
  if (pct >= 70) document.getElementById('status').textContent = 'Almost there…';
}, 400);

var readyFallback = null;
var overlayHidden = false;
function hideOverlay() {
  if (overlayHidden) return;
  overlayHidden = true;
  clearInterval(barInterval);
  if (readyFallback) clearTimeout(readyFallback);
  document.getElementById('bar').style.width = '100%';
  document.getElementById('status').textContent = 'Game ready!';
  setTimeout(function() {
    document.getElementById('overlay').classList.add('hidden');
  }, 300);
}

// The Pygbag game posts this once its first frame is actually on screen
// (see game.py `_signal_ready`). That is the right moment to reveal the game:
// the iframe's own load event fires much earlier, while the WASM runtime is
// still compiling — which is when pygbag's raw loading screen would show.
window.addEventListener('message', function(e) {
  if (e && e.data === 'SI3LN_GAME_READY') hideOverlay();
});

frame.onload = function() {
  // iframe DOM is up, but the game is still booting — keep the branded overlay
  // until SI3LN_GAME_READY arrives, with a safety net in case it never does.
  document.getElementById('status').textContent = 'Loading Python runtime…';
  readyFallback = setTimeout(hideOverlay, 30000);
};
frame.onerror = function() {
  clearInterval(barInterval);
  document.getElementById('status').textContent = 'Failed to load game. Please retry.';
};

frame.src = pygbagSrc;


</script>
</body>
</html>
